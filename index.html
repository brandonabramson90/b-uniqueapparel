<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>B-Uniques Boutique | Premium Streetwear & Custom Apparel</title>
  <meta name="description" content="Premium streetwear & custom design apparel. Shop hoodies, tees, joggers, hats & accessories. Custom orders welcome — free mockup + quote within 24 hours. Free shipping over $75." />

  <!-- Open Graph -->
  <meta property="og:title" content="B-Uniques Boutique | Premium Streetwear & Custom Apparel" />
  <meta property="og:description" content="Shop fire hoodies, tees, joggers, hats & accessories. Custom orders ship in 10–14 days. Free shipping over $75." />
  <meta property="og:image" content="og-image.jpg" />
  <meta property="og:url" content="https://b-uniqueapparel.com" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── TOKENS ─────────────────────────────────────────────── */
    :root {
      --black:   #0a0a0a;
      --dark:    #111111;
      --charcoal:#1c1c1c;
      --gold:    #c9a84c;
      --gold-lt: #e8c76a;
      --white:   #f5f5f0;
      --gray:    #8a8a8a;
      --border:  #2a2a2a;
      --red:     #c0392b;
      --font-display: 'Bebas Neue', sans-serif;
      --font-cond:    'Barlow Condensed', sans-serif;
      --font-body:    'Barlow', sans-serif;
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* ─── UTILITY ────────────────────────────────────────────── */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .section-label {
      font-family: var(--font-cond);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .btn-primary {
      display: inline-block;
      background: var(--gold);
      color: var(--black);
      font-family: var(--font-cond);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 14px 32px;
      border: none;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }
    .btn-primary:hover { background: var(--gold-lt); transform: translateY(-1px); }
    .btn-outline {
      display: inline-block;
      background: transparent;
      color: var(--white);
      font-family: var(--font-cond);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 13px 32px;
      border: 1.5px solid var(--white);
      cursor: pointer;
      transition: background .2s, color .2s, transform .15s;
    }
    .btn-outline:hover { background: var(--white); color: var(--black); transform: translateY(-1px); }
    .divider { border: none; border-top: 1px solid var(--border); }

    /* ─── ANNOUNCEMENT BAR ───────────────────────────────────── */
    .announcement {
      background: var(--gold);
      color: var(--black);
      text-align: center;
      padding: 9px 20px;
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    /* ─── NAV ────────────────────────────────────────────────── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--black);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 24px;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 28px;
      letter-spacing: .08em;
      color: var(--white);
      flex-shrink: 0;
    }
    .nav-logo span { color: var(--gold); }
    .nav-links {
      display: flex;
      gap: 32px;
      align-items: center;
    }
    .nav-links a {
      font-family: var(--font-cond);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gray);
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-right a {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .nav-cta { color: var(--gold) !important; }
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--white);
      transition: all .25s;
    }
    .mobile-menu {
      display: none;
      flex-direction: column;
      background: var(--dark);
      border-bottom: 1px solid var(--border);
      padding: 20px;
      gap: 16px;
    }
    .mobile-menu a {
      font-family: var(--font-cond);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--white);
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .mobile-menu.open { display: flex; }

    /* ─── HERO ───────────────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 90vh;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: var(--dark);
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(201,168,76,.06) 0%, transparent 50%),
        linear-gradient(to bottom, transparent 40%, rgba(10,10,10,.95) 100%);
      z-index: 1;
    }
    /* Texture grain overlay */
    .hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px;
      opacity: .4;
      pointer-events: none;
    }
    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: .35;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 700px;
      padding: 80px 20px;
      margin: 0 auto 0 max(20px, calc((100vw - 1200px)/2 + 20px));
    }
    .hero-eyebrow {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(60px, 10vw, 110px);
      line-height: .95;
      letter-spacing: .02em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }
    .hero-title em {
      font-style: normal;
      color: var(--gold);
    }
    .hero-desc {
      font-size: 17px;
      color: rgba(245,245,240,.75);
      max-width: 480px;
      margin-bottom: 36px;
      line-height: 1.65;
    }
    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .hero-trust {
      margin-top: 56px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .trust-icon {
      width: 36px;
      height: 36px;
      border: 1.5px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .trust-text {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(245,245,240,.7);
      line-height: 1.3;
    }

    /* ─── BUYING BASICS STRIP ────────────────────────────────── */
    /* FIX: audit said "too many slogans, not enough shopping basics" */
    .basics-strip {
      background: var(--charcoal);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }
    .basics-inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    .basics-item {
      padding: 22px 28px;
      border-right: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .basics-item:last-child { border-right: none; }
    .basics-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
    .basics-label {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--gold);
      display: block;
      margin-bottom: 2px;
    }
    .basics-val {
      font-size: 13px;
      color: rgba(245,245,240,.65);
      line-height: 1.4;
    }

    /* ─── COLLECTIONS ────────────────────────────────────────── */
    .collections { padding: 80px 0 60px; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
    }
    .section-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 56px);
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1;
    }
    .section-link {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .collection-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    .collection-card {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4/3;
      background: var(--charcoal);
      cursor: pointer;
    }
    .collection-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }
    .collection-card:hover img { transform: scale(1.04); }
    .collection-card .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,.85) 0%, transparent 55%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 28px;
    }
    .col-tag {
      font-family: var(--font-cond);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .col-title {
      font-family: var(--font-display);
      font-size: 32px;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .col-desc { font-size: 13px; color: rgba(245,245,240,.7); margin-bottom: 16px; }
    .col-cta {
      font-family: var(--font-cond);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ─── PRODUCTS ───────────────────────────────────────────── */
    .products { padding: 60px 0; }
    .products-intro {
      font-size: 15px;
      color: rgba(245,245,240,.6);
      margin-bottom: 40px;
      max-width: 480px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .product-card {
      background: var(--dark);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: border-color .2s, transform .2s;
      cursor: pointer;
    }
    .product-card:hover {
      border-color: var(--gold);
      transform: translateY(-3px);
    }
    .product-img-wrap {
      aspect-ratio: 1;
      overflow: hidden;
      background: var(--charcoal);
      position: relative;
    }
    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }
    .product-card:hover .product-img-wrap img { transform: scale(1.06); }
    .product-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--gold);
      color: var(--black);
      font-family: var(--font-cond);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 3px 8px;
    }
    .product-info { padding: 16px; }
    .product-collection {
      font-family: var(--font-cond);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .product-name {
      font-family: var(--font-cond);
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .product-sizes {
      font-size: 12px;
      color: var(--gray);
      margin-bottom: 10px;
    }
    .product-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-price {
      font-family: var(--font-cond);
      font-size: 18px;
      font-weight: 700;
      color: var(--white);
    }
    .product-btn {
      font-family: var(--font-cond);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--gold);
      color: var(--black);
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      transition: background .2s;
    }
    .product-btn:hover { background: var(--gold-lt); }

    /* ─── SIZING GUIDE ────────────────────────────────────────── */
    /* FIX: audit said missing sizing info near shop section */
    .sizing-strip {
      background: var(--charcoal);
      border: 1px solid var(--border);
      padding: 28px 36px;
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }
    .sizing-text h3 {
      font-family: var(--font-cond);
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }
    .sizing-text p { font-size: 14px; color: var(--gray); }
    .sizing-table {
      overflow-x: auto;
      margin-bottom: 40px;
    }
    .sizing-table table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .sizing-table th, .sizing-table td {
      padding: 10px 16px;
      border: 1px solid var(--border);
      text-align: center;
      font-family: var(--font-cond);
      letter-spacing: .04em;
    }
    .sizing-table th {
      background: var(--charcoal);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .sizing-table td { color: rgba(245,245,240,.8); }
    .sizing-table tr:nth-child(even) td { background: rgba(255,255,255,.02); }

    /* ─── CUSTOM ORDER ───────────────────────────────────────── */
    .custom { padding: 80px 0; }
    .custom-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: start;
    }
    .custom-left h2 {
      font-family: var(--font-display);
      font-size: clamp(40px, 5vw, 60px);
      text-transform: uppercase;
      letter-spacing: .04em;
      line-height: 1;
      margin-bottom: 20px;
    }
    .custom-left h2 span { color: var(--gold); }
    .custom-left p {
      font-size: 15px;
      color: rgba(245,245,240,.7);
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .custom-perks {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 32px;
    }
    .perk {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 14px;
      color: rgba(245,245,240,.8);
    }
    .perk-icon { color: var(--gold); font-size: 18px; flex-shrink: 0; margin-top: 1px; }

    /* ─── CONTACT FORM ───────────────────────────────────────── */
    /* FIX: wired to Formspree — replace YOUR_FORM_ID with real Formspree endpoint */
    .custom-form {
      background: var(--charcoal);
      border: 1px solid var(--border);
      padding: 36px;
    }
    .form-title {
      font-family: var(--font-cond);
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label {
      font-family: var(--font-cond);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--dark);
      border: 1px solid var(--border);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--gold); }
    .form-group select option { background: var(--dark); }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-submit {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .form-note {
      font-size: 12px;
      color: var(--gray);
      line-height: 1.4;
    }
    #form-success {
      display: none;
      background: rgba(201,168,76,.12);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 14px 20px;
      font-family: var(--font-cond);
      font-size: 14px;
      letter-spacing: .06em;
      margin-top: 16px;
    }
    #form-error {
      display: none;
      background: rgba(192,57,43,.12);
      border: 1px solid var(--red);
      color: #e74c3c;
      padding: 14px 20px;
      font-family: var(--font-cond);
      font-size: 14px;
      letter-spacing: .06em;
      margin-top: 16px;
    }

    /* ─── TRUST SECTION ──────────────────────────────────────── */
    /* FIX: audit said trust signals weak — added reviews + policies */
    .trust-section { padding: 80px 0; border-top: 1px solid var(--border); }
    .trust-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 40px;
    }
    .review-card {
      background: var(--charcoal);
      border: 1px solid var(--border);
      padding: 28px;
    }
    .review-stars { color: var(--gold); font-size: 16px; margin-bottom: 12px; }
    .review-text {
      font-size: 14px;
      color: rgba(245,245,240,.75);
      line-height: 1.65;
      margin-bo
